name: runner
on:
  push:
    paths: ['jobs/queue/**']
  workflow_dispatch:
concurrency:
  group: relay-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Execute queued jobs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          jobs=(jobs/queue/*.sh)
          if [ ${#jobs[@]} -eq 0 ]; then echo "no jobs"; exit 0; fi
          for job in "${jobs[@]}"; do
            name=$(basename "$job" .sh)
            echo "=== running $name ==="
            mkdir -p "out/$name"
            ( bash "$job" ) > "out/$name/stdout.log" 2>&1 && echo ok > "out/$name/status" || echo fail > "out/$name/status"
            rm -f "$job"
          done
      - name: Commit results (race-safe)
        if: always()
        run: |
          git config user.name "jarvis-agent-shn"
          git config user.email "sindre.h.nordgreen+agent@gmail.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "relay: job results [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo pushed; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git fetch origin main
            git rebase -X ours origin/main || git rebase --abort
            sleep 2
          done
          echo "push failed after retries"; exit 1
